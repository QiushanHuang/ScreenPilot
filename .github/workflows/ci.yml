name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test -c release
      - run: ./scripts/build-app.sh
      - run: codesign --verify --deep --strict dist/屏幕管家.app
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build WindowsBridge/ScreenPilotBridge.csproj -c Release
      - run: python scripts/test-windows-core.py
      - run: python scripts/package-windows-ready.py
      - run: python -m unittest discover -s Tests -p "test_*.py"
